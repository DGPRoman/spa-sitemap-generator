[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spa-sitemap-generator"
version = "1.0.0"
description = "Crawl a JavaScript-rendered site with a real browser and generate sitemap.xml"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["selenium>=4.11,<5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
spa-sitemap = "spa_sitemap.cli:main"

[tool.setuptools]
packages = ["spa_sitemap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "browser: needs a real Chrome install; deselect with -m 'not browser'",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = [
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["spa_sitemap"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["selenium.*"]
ignore_missing_imports = true
